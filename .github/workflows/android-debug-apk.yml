name: Build Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://hoqdkxlqwnnyetidmjya.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_4hGQ4xPcErTUXrwMbithvQ_xKQ_Hn2u
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Add Android runtime permissions
        run: node scripts/patch-android-manifest.mjs
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dms-connect-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
